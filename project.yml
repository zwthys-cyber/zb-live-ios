name: Live
options:
  bundleIdPrefix: app.personal.zb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  Live:
    type: application
    platform: iOS
    sources:
      - path: ios/Live
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: 直播
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 你选择的直播网页需要摄像头时，用于网页内的视频功能。
        NSMicrophoneUsageDescription: 你选择的直播网页需要麦克风时，用于网页内的语音功能。
        NSLocalNetworkUsageDescription: 播放你添加的局域网直播源。
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.personal.zb.live
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  LiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/LiveTests
    dependencies:
      - target: Live
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.personal.zb.live.tests
  LiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tests/LiveUITests
    dependencies:
      - target: Live
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.personal.zb.live.uitests
schemes:
  Live:
    build:
      targets:
        Live: all
    test:
      targets:
        - LiveTests
        - LiveUITests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
